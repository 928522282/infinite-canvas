name: Build Windows Connector

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canvas-agent/package-lock.json

      - name: Build Canvas Agent
        working-directory: canvas-agent
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Stage portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $PWD "connector/windows/staging"
          New-Item -ItemType Directory -Force -Path "$stage/runtime", "$stage/app" | Out-Null
          Copy-Item canvas-agent/dist, canvas-agent/node_modules -Destination "$stage/app" -Recurse
          Copy-Item canvas-agent/package.json, canvas-agent/agent-instructions.md -Destination "$stage/app"
          $nodeVersion = node -p "process.versions.node"
          $archive = Join-Path $env:RUNNER_TEMP "node.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "node-runtime"
          Invoke-WebRequest "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $expanded
          Copy-Item "$expanded/node-v$nodeVersion-win-x64/node.exe" "$stage/runtime/node.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim().TrimStart("v")
          $siteUrl = "${{ vars.CANVAS_SITE_URL }}"
          if (-not $siteUrl) { throw "Set the CANVAS_SITE_URL repository variable before building the connector." }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DMyCanvasUrl=$siteUrl" connector/windows/InfiniteCanvasConnector.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Infinite-Canvas-Connector-Windows-x64
          path: connector/windows/output/Infinite-Canvas-Connector-Windows-x64.exe

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: connector/windows/output/Infinite-Canvas-Connector-Windows-x64.exe
